<style>
  :root{
    --navy:#0A1F44; --blue:#2F6BFF; --ink:#14213D; --muted:#5B6785; --bg:#F3F5FB; --card:#FFFFFF; --line:#E3E8F4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 400px at 50% -120px, #DCE6FF 0%, rgba(220,230,255,0) 70%),
      var(--bg);
    min-height:100vh;
    display:flex;justify-content:center;
    padding:32px 16px 48px;
  }
  .wrap{width:100%;max-width:440px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 10px 30px rgba(10,31,68,.08);
    padding:32px 24px 28px;
    text-align:center;
  }
  .avatar{
    width:132px;height:132px;border-radius:50%;
    object-fit:cover;object-position:50% 50%;
    border:4px solid #fff;
    box-shadow:0 0 0 3px var(--blue), 0 8px 20px rgba(10,31,68,.15);
    background:#dfe6f7;
  }
  h1{margin-top:18px;font-size:1.7rem;line-height:1.2;color:var(--navy);letter-spacing:-.01em}
  .tag{margin-top:6px;color:var(--muted);font-size:.98rem;line-height:1.5}
  .links{display:grid;gap:12px;margin-top:26px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;font-weight:600;font-size:1rem;
    padding:15px 18px;border-radius:14px;
    border:1.5px solid var(--navy);color:var(--navy);background:#fff;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,31,68,.18);outline:none}
  .btn:hover,.btn:focus-visible,.btn:active{background:var(--navy);color:#fff}
  .btn svg{width:20px;height:20px;flex:none}
  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;border:none}
    .btn{border-color:#000}
  }
  .icons{display:flex;justify-content:center;gap:14px;margin-top:22px}
  .ico{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--navy);border:1.5px solid var(--line);background:#fff;text-decoration:none;
    transition:background .12s ease,color .12s ease,transform .12s ease;
  }
  .ico svg{width:18px;height:18px}
  .ico:hover,.ico:focus-visible,.ico:active{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-2px);outline:none}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--navy);color:#fff;font-size:.9rem;padding:11px 16px;border-radius:12px;
    box-shadow:0 8px 20px rgba(10,31,68,.25);transition:opacity .2s ease,transform .2s ease;max-width:90vw;text-align:center
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="avatar" src="assets/photo.jpg" alt="Shahd Yacout" width="132" height="132">
      <h1>Shahd Yacout</h1>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16v-4M12 16V8M17 16v-6"/></svg>

        </a>
      </nav>

      <div class="icons">
        <a class="ico" href="https://mail.google.com/mail/?view=cm&fs=1&to=shahdyacout4@gmail.com&su=Hello%20Shahd" target="_blank" rel="noopener" aria-label="Email" title="shahdyacout4@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      var toast=document.getElementById('toast'),timer;
      function show(msg){
        toast.textContent=msg;toast.classList.add('show');
        clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove('show')},2600);
      }
      document.querySelectorAll('[data-copy]').forEach(function(a){
        a.addEventListener('click',function(e){
          var v=a.getAttribute('data-copy');
          var touch=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
          if(!touch){e.preventDefault();}
          try{
            if(navigator.clipboard&&navigator.clipboard.writeText){
              navigator.clipboard.writeText(v).then(function(){show('Copied: '+v)},function(){show(v)});
            }else{show(v)}
          }catch(e){show(v)}
        });
      });
    })();
  </script>
